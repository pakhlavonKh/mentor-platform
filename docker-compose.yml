version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: studyqadam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studyqadampassword123}
      POSTGRES_DB: ${DB_NAME:-studyqadam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-studyqadam}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyqadam-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-studyqadampassword123}
      DB_NAME: ${DB_NAME:-studyqadam}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-please_set_a_secure_jwt_secret_in_env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-+905000000000}
      TELEGRAM_CHANNEL_URL: ${TELEGRAM_CHANNEL_URL:-https://t.me/studyqadam_corporate}
      TELEGRAM_CHANNEL_USERNAME: ${TELEGRAM_CHANNEL_USERNAME:-@studyqadam_corporate}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      UPLOAD_DIR: /app/uploads/submissions
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network

  # 3. Frontend Web App (Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: studyqadam-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network

volumes:
  postgres_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
